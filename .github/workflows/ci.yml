name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=markdown:coverage.md

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aiblueprint-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — MCP initialize handshake over stdio
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out="$(echo "$req" | timeout 30 docker run --rm -i aiblueprint-mcp:ci)"
          echo "$out"
          echo "$out" | grep -q '"serverInfo"' || { echo "::error::no initialize response from container"; exit 1; }
